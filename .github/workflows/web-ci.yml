name: Web Release Gates

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/
          scope: '@cgraph-dev'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm check:packages
      - run: pnpm check:package-owner
      - run: pnpm --filter @cgraph/web lint
      - run: pnpm --filter @cgraph/web typecheck
      - run: pnpm --filter @cgraph/web check:release-gates
      - run: pnpm --filter @cgraph/web build:budget

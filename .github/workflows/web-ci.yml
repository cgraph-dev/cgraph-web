name: Web Release Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:packages
      - run: pnpm --filter @cgraph/web typecheck
      - run: pnpm --filter @cgraph/web check:safe-html
      - run: pnpm --filter @cgraph/web check:storage-policy
      - run: pnpm --filter @cgraph/web check:import-cycles
      - run: pnpm --filter @cgraph/web check:background-polling
      - run: pnpm --filter @cgraph/web check:auth-storage
      - run: pnpm --filter @cgraph/web build:budget
